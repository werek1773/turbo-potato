name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: BoulderKit tests
        run: swift test --package-path Packages/BoulderKit
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Wspinaczka.xcodeproj \
            -scheme Wspinaczka \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*(Sendable|isolated)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build.log
